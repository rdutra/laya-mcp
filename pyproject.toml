[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-mcp"
version = "0.1.0"
description = "Persistent local MCP server for Laya-CoreML typed decisions"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "laya-mcp contributors" }]
keywords = ["mcp", "coreml", "apple-silicon", "classification", "local-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "laya-coreml>=0.1.0,<0.2",
  "mcp>=2.2.0,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
laya-mcp = "laya_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
